# GG: tags publish a release, as upstream. Pushes to gg and gg/* branches, and manual runs,
# build the same files as a workflow artifact only, so work in progress can be tested without
# publishing a release.
on:
  push:
    tags:
      - '*'
    branches:
      - 'gg'
      - 'gg/**'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: taforever/ci-ubuntu-focal:latest
    env:
      PUB_KEY: ${{ secrets.UID_PUBLIC_KEY_PEM }}

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: 'true'

    - name: Get release tag from GITHUB_REF
      id: vars
      run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}

    - name: Write PUB key into file
      run: echo "$PUB_KEY" > faf_pub.pem

    - name: Windows x86
      run: |
          mkdir -p build-${{env.BUILD_TAG}} && cd build-${{env.BUILD_TAG}}
          ../build-i686-w64-mingw32.sh
          zip gpgnet4ta-${{env.BUILD_TAG}}.zip bin/*
      env:
        BUILD_TAG: win-x86

    - name: Ubuntu Focal
      run: |
          mkdir -p build-${{env.BUILD_TAG}} && cd build-${{env.BUILD_TAG}}
          ../build-gcc.sh
          tar -zcf gpgnet4ta-${{env.BUILD_TAG}}.tar.gz bin/*
      env:
        BUILD_TAG: ubuntu-focal-x64

    - name: Upload artifacts
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          build-win-x86/gpgnet4ta-win-x86.zip
          build-ubuntu-focal-x64/gpgnet4ta-ubuntu-focal-x64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload test build
      uses: actions/upload-artifact@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: gpgnet4ta-${{ github.sha }}
        retention-days: 14
        path: |
          build-win-x86/gpgnet4ta-win-x86.zip
          build-ubuntu-focal-x64/gpgnet4ta-ubuntu-focal-x64.tar.gz
